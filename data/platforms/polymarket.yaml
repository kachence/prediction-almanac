# Annotated exemplar - copy this file when adding a platform.
slug: polymarket            # must equal the filename
name: Polymarket
url: https://polymarket.com
mechanism: onchain-clob     # onchain-clob | onchain-amm | regulated-exchange | play-money | forecasting
chain: Polygon
status: live                # live | beta | deprecated | dead
defillama: polymarket-international
launched: 2020
geo:                        # factual "who may trade" - never an evasion guide
  model: global-restrictions # everyone | permissionless | global-restrictions | allowlist
  restricted: [au, be, bi, br, by, ca, cd, cf, cu, de, et, fr, gb, hu, ie, iq, ir, it, jp, kp, lb, ly, mm, mt, ni, nl, nz, pl, ru, sd, sg, si, sk, so, ss, sy, th, tw, um, us, ve, ye, zw] # ISO 3166-1 alpha-2, lowercase
  source: https://polymarket.com/tos         # the terms page the list was read from
  as_of: "2026-08-12"
  notes: "Trading-only restriction; content stays available. US blocked/close-only on the global venue - the CFTC-regulated Polymarket US exchange (Dec 2025, via QCX) is separate. Canada at province level (AB/BC/ON/QC), Ukraine only Crimea/Donetsk/Luhansk. Separately, Bulgaria blacklists polymarket.com at ISP level (NRA, Jan 2026) - a state block, not Polymarket's."
# ---- auto-filled by scripts/refresh.py - seed as nulls ----
metrics:
  volume_usd: 2266380905
  period: 30d
  source: defillama (polymarket-international)
  as_of: "2026-09-01"
# -----------------------------------------------------------
data:                       # what you can get out - cross-links data/sources/ slugs
  public_api: true
  live_orderbook: true
  historical: partial       # none | partial | full
  granularity: trade+book
  free_archive: pmxt        # slug in data/sources/, or null
  known_gaps: "No official bulk historical-trade endpoint; third-party archives have day/week gaps on some markets."
  recorder_support: planned # yes | planned | no
description: "Largest on-chain prediction market; USDC-settled CLOB on Polygon."
tags: [crypto, clob, politics, sports, weather]
