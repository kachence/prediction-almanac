# Considered and deliberately NOT listed, with the reason. This is a real part of the
# data model: the intake bot checks submissions against it, so a rejected resource does
# not come back every few weeks, and readers can see what was weighed and why.
#
# Scope rule: this directory lists genuine prediction markets - venues trading contracts
# on the outcome of real-world events. Sportsbooks, casinos, and betting-liquidity
# protocols are adjacent but out of scope, even when they settle on-chain.

- name: Azuro
  url: https://azuro.org
  type: platform
  reason: >-
    Sports-betting liquidity protocol powering third-party sportsbooks, not a
    prediction market venue in its own right.
  decided: "2026-08-12"

- name: Overtime
  url: https://overtimemarkets.xyz
  type: platform
  reason: >-
    Sports betting (Thales protocol family) with an AMM, not event-outcome
    prediction markets.
  decided: "2026-08-12"

- name: Hyperliquid Outcomes (HIP-4)
  url: https://app.hyperliquid.xyz/outcomes
  type: platform
  reason: >-
    Exchange infrastructure rather than a venue in its own right - HIP-4 is an
    order-book primitive that front-ends build on, and mainnet inventory is a
    handful of recurring crypto price binaries.
  decided: "2026-08-12"

- name: ForecastEx
  url: https://forecastex.com
  type: platform
  reason: >-
    A CFTC-licensed exchange that retail cannot access directly; it is the
    matching venue behind broker front-ends such as IBKR ForecastTrader, which
    are listed instead.
  decided: "2026-08-12"

- name: Iowa Electronic Markets
  url: https://iem.uiowa.edu
  type: platform
  reason: >-
    Academic research market with $500 account caps, no API, and negligible
    volume; of historical interest rather than practical use.
  decided: "2026-08-12"

- name: Futuur
  url: https://futuur.com
  type: platform
  reason: >-
    Play-money side adds no data or liquidity, and the real-money side is
    offshore-licensed with 39 countries blocked and no historical API. Nothing
    in the directory references it.
  decided: "2026-08-12"

- name: Hypermind
  url: https://www.hypermind.com
  type: platform
  reason: >-
    Prize-based forecasting with no public API and no exportable data, so it
    offers nothing to a trader or a builder.
  decided: "2026-08-12"

- name: Good Judgment Open
  url: https://www.gjopen.com
  type: platform
  reason: >-
    No API and no data export. Metaculus covers the same ground with full
    public forecast history.
  decided: "2026-08-12"

- name: Rain
  url: https://www.rain.trade
  type: platform
  reason: >-
    A real venue, but not a measurable one. DefiLlama tracks its retired
    deployment and reads zero, its own API reports pool collateral rather than
    traded volume, and roughly half the all-time volume was one address trading
    with itself.
  decided: "2026-08-13"
