# Runs on every PR. Validates the data only, and never looks at README.md, because
# contributors edit data/ and the README is rebuilt after merge. Read-only, no secrets,
# so it is safe to run on a fork's pull request.
name: validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build.py --validate
