# Build & pipeline configuration. Data lives in data/; this file controls presentation
# and (later) refresh/intake behavior.

site:
  title: Prediction Almanac
  repo: kachence/prediction-almanac
  tagline: >-
    Every prediction market worth trading, the data you can actually backtest on, and
    the tools people have really shipped. Rebuilt from scratch daily, so it can't rot.

# Display groups for the Platforms section, in order. Every mechanism must be covered.
# show_volume: whether the group's table gets a Volume column (real-money groups only -
# play-money volume isn't USD and forecasting has none).
platform_groups:
  - keys: [onchain]
    title: On-chain markets
    mechanisms: [onchain-clob, onchain-amm]
    show_volume: true
  - keys: [regulated]
    title: Regulated exchanges & brokers
    mechanisms: [regulated-exchange, broker]
    show_volume: true
  - keys: [research-venues]
    title: Research & play-money venues
    mechanisms: [play-money, forecasting]
    show_volume: false
    note: >-
      You can't make real money on these. What you can get is complete, free
      history, and that's what you backtest on before risking anything on the
      venues above.

# Tool sections, in display order. `key` must match schema/tool.schema.json's category
# enum; `note` says who the section is for, since a bare label doesn't.
tool_categories:
  - keys: [bot]
    title: Trading bots, agents & execution
    parent: tools
    item_label: Tool
    extra: status
    note: >-
      Code that trades: market makers, arbitrage bots, agents, and the layers you
      execute through. Read the licence and the code before you point any of it at
      real money. None of it is audited and a stale repo is a liability.
  - keys: [arbitrage, aggregator]
    title: Cross-venue search & arbitrage
    parent: tools
    item_label: Tool
    extra: access
    note: >-
      Finding where an event trades, and where it trades cheaper. Most of the edge
      in this space lives in that gap.
  - keys: [dashboard]
    title: Dashboards & market data
    parent: tools
    item_label: Tool
    extra: access
    note: >-
      Watching flow, positions and volume without building your own pipeline. The
      leaderboards also tell you which wallets are worth copying, or fading.
  - keys: [data]
    title: Data tooling
    parent: tools
    item_label: Tool
    extra: access
    note: >-
      Paid. It's here because reconstructing historical book depth is the one thing
      nothing free on this page can do.
  - keys: [research]
    title: Research
    parent: research
    item_label: Paper
    covers_default: general
    extra: year
    note: >-
      Mostly papers, and that isn't an accident. Every venue's "learn" page is
      marketing. The 2026 academic work is free and genuinely useful: order-book
      microstructure, maker versus taker returns, where prices are systematically
      wrong, and how much arbitrage capacity really exists.
  - keys: [newsletter]
    title: Blogs
    parent: writing
    item_label: Blog
    covers: false
    extra: last_post
    note: >-
      People worth reading, free and not owned by an exchange. Last post comes from
      each blog's own feed, so one that goes quiet shows it here instead of sitting
      around looking current. Building something in this space? Put yourself in
      this table.
  - keys: [social]
    title: X accounts
    parent: writing
    item_label: Account
    covers: false
    note: >-
      The only rows here that nothing checks. X killed its free API tier in
      February 2026, so confirming an account is even still alive now costs money
      per lookup. These three are in on outside coverage, not follower counts. I
      checked the podcasts too. None of them qualified.
  - keys: [alerting]
    title: Alerting
  - keys: [extension]
    title: Browser extensions


# "Who can trade" cell rendering.
geo_display:
  max_flags: 8 # up to this many restricted countries render as flags; above it,
                        # show the notable ones + a count (a 55-flag wall helps nobody)
  lead_flags: 4 # how many notable flags to lead with when over max_flags
  # Countries most readers check first, in priority order. Only affects display order.
  notable: [us, gb, ca, au, de, fr, nl, it, es, cn, in, jp, sg, br]

# Saved Dune queries, for venues no free aggregator covers correctly. The SQL lives in
# scripts/queries/ and must be re-saved to Dune if edited; refresh.py skips these
# silently when DUNE_API_KEY is absent, so the build still works without a key.
dune:
  rain: 8304985 # scripts/queries/rain_volume.sql

# Used by scripts/refresh.py (step 2+).
thresholds:
  stale_days: 365 # last commit older than this -> github.health: stale
  liveness_timeout_s: 10

# Used by scripts/intake.py (step 4+).
intake:
  auto_merge_confidence: 0.85
