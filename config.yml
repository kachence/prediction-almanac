# Build & pipeline configuration. Data lives in data/; this file controls presentation
# and (later) refresh/intake behavior.

site:
  title: Prediction Almanac
  repo: kachence/prediction-almanac
  tagline: >-
    The self-updating almanac of prediction markets — every platform, the data you can
    actually get out of it, and the tools around them.

# Display groups for the Platforms section, in order. Every mechanism must be covered.
# show_volume: whether the group's table gets a Volume column (real-money groups only —
# play-money volume isn't USD and forecasting has none).
platform_groups:
  - keys: [onchain]
    title: On-chain markets
    mechanisms: [onchain-clob, onchain-amm]
    show_volume: true
  - keys: [regulated]
    title: Regulated exchanges & brokers
    mechanisms: [regulated-exchange, broker]
    show_volume: true
  - keys: [research]
    title: Research & play-money venues
    mechanisms: [play-money, forecasting]
    show_volume: false
    note: >-
      Listed for their data, not for trading. These are the only platforms here
      with complete, free, public history, which is what you backtest and
      calibrate against before risking money on the venues above.

# Tool sections, in display order. `key` must match schema/tool.schema.json's category
# enum; `note` says who the section is for, since a bare label doesn't.
tool_categories:
  - keys: [bot]
    title: Trading bots & agents
    note: >-
      Running strategies against these venues: market making, arbitrage, and
      autonomous agents. Read the licence and the code before pointing anything at
      real money — none of this is audited, and a stale repo is a liability.
  - keys: [arbitrage, aggregator]
    title: Cross-venue search & arbitrage
    note: >-
      Finding where an event trades at all, and where it trades at a different
      price — which is where most of the edge in this space actually lives.
  - keys: [dashboard]
    title: Dashboards & market data
    note: >-
      Watching flow, positions, and volume without building your own pipeline.
  - keys: [analytics]
    title: Analytics & calibration
    note: >-
      Judging whether prices are any good — accuracy scoring, calibration curves,
      and personal forecast tracking.
  - keys: [api-sdk]
    title: APIs, SDKs & CLIs
    note: >-
      The connection layer. Only current, maintained clients are listed — a
      superseded SDK costs more time than it saves.
  - keys: [infra]
    title: Protocol internals
    note: >-
      Settlement mechanics rather than convenience tooling. Relevant if you hedge
      by splitting and merging outcome tokens, or you are building execution that
      touches the contracts directly.
  - keys: [education]
    title: Research & education
    note: >-
      Material that teaches something durable about pricing, mechanism design, and
      forecasting skill.
  - keys: [alerting]
    title: Alerting
  - keys: [data]
    title: Data tooling
  - keys: [extension]
    title: Browser extensions


# "Who can trade" cell rendering.
geo_display:
  max_flags: 8          # up to this many restricted countries render as flags; above it,
                        # show the notable ones + a count (a 55-flag wall helps nobody)
  lead_flags: 4         # how many notable flags to lead with when over max_flags
  # Countries most readers check first, in priority order. Only affects display order.
  notable: [us, gb, ca, au, de, fr, nl, it, es, cn, in, jp, sg, br]

# Saved Dune queries, for venues no free aggregator covers correctly. The SQL lives in
# scripts/queries/ and must be re-saved to Dune if edited; refresh.py skips these
# silently when DUNE_API_KEY is absent, so the build still works without a key.
dune:
  rain: 8304985      # scripts/queries/rain_volume.sql

# Used by scripts/refresh.py (step 2+).
thresholds:
  stale_days: 365          # last commit older than this -> github.health: stale
  liveness_timeout_s: 10

# Used by scripts/intake.py (step 4+).
intake:
  auto_merge_confidence: 0.85
