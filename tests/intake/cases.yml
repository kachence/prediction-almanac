# Every closed submission so far, with the maintainer's decision and what decided it.
# `python scripts/intake.py --replay` runs the gates (and optionally the model) against
# the inputs in inputs/ and reports where it would have disagreed with these calls.
#
# Gates run against today's internet, not the state at submission time, so a case can
# drift: a venue that was empty can fill up, a 404 can come back. The `decided_by` note
# is there so a disagreement can be read for what it is.

- ref: pr-2
